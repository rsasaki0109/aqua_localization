# MBES bathymetric SLAM on beach_pond without the GNSS compass:
# aqua_graph (IMU + DVL + depth hold, gyro bias held, as in
# beach_pond_graph_no_compass.yaml) feeds aqua_pose_graph; mbes_loop_closure
# builds motion-compensated bathymetric submaps (every Norbit ping placed at
# its own aqua_graph pose) between keyframes, registers revisited submaps and
# sends loop constraints back to the pose graph.
#
#   ros2 run aqua_replay offline_replay \
#     --scenario $(ros2 pkg prefix aqua_replay)/share/aqua_replay/scenarios/beach_pond_mbes_slam.yaml \
#     --bag beach_pond_ros2 --extra-bag beach_pond_aux --out /tmp/beach_pond_mbes_slam
input:
  topics:
    - /nav/sensors/microstrain/imu/raw
    - /nav/processed/nortek/dvl_twist
    - /norbit/detections
    - /nav/processed/odometry
  order: header
  reorder_window_s: 0.5
  start_offset_s: 855.0

nodes:
  - plugin: aqua_graph::AquaGraphNode
    name: aqua_graph
    params_files: [$(find-pkg-share aqua_graph)/config/beach_pond.yaml]
    parameters:
      topics:
        heading: ""
      init:
        gyro_bias_sigma: 0.00001
      imu:
        gyro_bias_random_walk: 0.000001
      publish:
        imu_rate: true
  - plugin: aqua_pose_graph::PoseGraphNode
    name: aqua_pose_graph
    params_files: [$(find-pkg-share aqua_pose_graph)/config/params.yaml]
    parameters:
      topics:
        odometry: /aqua_graph/odometry
      keyframe:
        # One bathymetric submap per keyframe interval: ~10 s of track,
        # i.e. a ~20 m x ~50 m swath patch.
        translation_m: 20.0
        rotation_rad: 0.35
      edges:
        # Relative dead-reckoning error over one 20 m edge without a compass:
        # ~2 % of distance in translation, gyro-limited in rotation.
        default_translation_information: 4.0      # 1 / (0.5 m)^2
        default_rotation_information: 2500.0      # 1 / (0.02 rad)^2
  - plugin: aqua_sonar_loc::MbesLoopClosureNode
    name: mbes_loop_closure
    params_files: [$(find-pkg-share aqua_sonar_loc)/config/mbes_loop_closure.yaml]
    parameters:
      topics:
        points: /norbit/detections
        odometry: /aqua_graph/odometry
      sensor:
        # norbit in the ustrain_imu (aqua_graph body) frame, from /tf_static.
        translation_m: [0.089, 0.353, -0.843]
        rotation_rpy_rad: [3.141592653589793, 0.0, -1.5707963267948966]
        min_range_m: 1.0
        # Beams within 45 deg only: outer beams are refraction-limited.
        max_across_track_ratio: 1.0
      submaps:
        # 20 Hz x 512 beams x ~10 s per submap before the voxel filter.
        max_points: 200000
        min_points: 500
        voxel_leaf_m: 0.5
        max_submaps: 2000
      candidates:
        min_keyframe_separation: 10
        # Anchors of overlapping swaths can be ~2 swath half-widths apart.
        max_distance_m: 40.0
      gates:
        max_correction_translation_m: 10.0

output:
  storage_id: mcap
  topics:
    - {topic: /nav/processed/odometry, type: nav_msgs/msg/Odometry}
    - /aqua_graph/odometry
    - /aqua_graph/status
    - /aqua_pose_graph/path
    - /aqua_pose_graph/keyframe
    - /aqua_pose_graph/loop_constraint
    - /aqua_pose_graph/loop_constraint_count
    - /aqua_pose_graph/optimization_count
    - /mbes_loop_closure/status
