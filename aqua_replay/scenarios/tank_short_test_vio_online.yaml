# Tank Dataset short_test with the online C++ stereo frontend
# (aqua_visual_frontend) running in the same process as aqua_graph: the
# replay feeds the raw compressed stereo images instead of a precomputed
# feature bag, so this is exactly what a live run computes, made
# deterministic. Settings match tank_short_test_vio.yaml + the offline
# frontend (100 features, every 2nd frame published).
#
#   ros2 run aqua_replay offline_replay \
#     --scenario $(ros2 pkg prefix aqua_replay)/share/aqua_replay/scenarios/tank_short_test_vio_online.yaml \
#     --bag <short_test_ros2> --out /tmp/tank_vio_online
input:
  topics:
    - /imu/data
    - /pressure
    - /dvl/twist
    - /apriltag_slam/GT
    - /camera/left/image_dehazed/compressed
    - /camera/right/image_dehazed/compressed
  order: header
  reorder_window_s: 0.5

nodes:
  - plugin: aqua_visual_frontend::StereoFrontendNode
    name: stereo_frontend
    parameters:
      max_features: 100
      publish_every: 2
  - plugin: aqua_graph::AquaGraphNode
    name: aqua_graph
    params_files: [$(find-pkg-share aqua_graph)/config/tank_dataset.yaml]
    parameters:
      topics:
        stereo_features: /aqua_visual_frontend/stereo_features

output:
  storage_id: mcap
  topics:
    - {topic: /apriltag_slam/GT, type: nav_msgs/msg/Odometry}
    - /aqua_graph/odometry
    - /aqua_graph/status
    - /aqua_visual_frontend/stereo_features
    - /aqua_visual_frontend/processing_time_ms
