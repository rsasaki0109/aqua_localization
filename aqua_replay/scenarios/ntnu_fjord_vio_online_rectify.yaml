# Same as ntnu_fjord_vio.yaml, but the bag carries the raw fisheye pair
# (convert_ntnu_stereo_bag.py --no-rectify) and aqua_visual_frontend
# rectifies it online from the Kalibr camchain, as on the live vehicle.
# The camchain path is per machine, so pass it on the command line:
#
#   ros2 run aqua_replay offline_replay \
#     --scenario $(ros2 pkg prefix aqua_replay)/share/aqua_replay/scenarios/ntnu_fjord_vio_online_rectify.yaml \
#     --bag fjord_1_raw_ros2 --out /tmp/fjord_vio_online \
#     --param stereo_frontend:rectify.camchain:=camchain-stereo-intrinsics-underwater.yaml
input:
  topics:
    - /imu/data
    - /reference/odometry
    - /camera/left/image_raw/compressed
    - /camera/right/image_raw/compressed
  order: header
  reorder_window_s: 0.5

nodes:
  - plugin: aqua_visual_frontend::StereoFrontendNode
    name: stereo_frontend
    parameters:
      topics:
        left: /camera/left/image_raw/compressed
        right: /camera/right/image_raw/compressed
      max_features: 150
      rectify:
        left_camera: cam1
        right_camera: cam0
      publish_every: 2
      # Hazy fjord water with sun glare: equalize contrast, keep features
      # out of blown-out regions (2026-10-11 drift diagnosis, fjord_5/6).
      clahe_clip_limit: 2.0
      saturation_level: 245
  - plugin: aqua_graph::AquaGraphNode
    name: aqua_graph
    params_files:
      - $(find-pkg-share aqua_graph)/config/ntnu_fjord.yaml
      - $(find-pkg-share aqua_graph)/config/ntnu_fjord_stereo_geometry.yaml

# processing_time_ms is wall-clock and would make the fingerprint vary run
# to run; it is measured in live runs (run_tank_live.py) instead.
output:
  storage_id: mcap
  topics:
    - {topic: /reference/odometry, type: nav_msgs/msg/Odometry}
    - /aqua_graph/odometry
    - /aqua_graph/status
    - /aqua_visual_frontend/stereo_features
